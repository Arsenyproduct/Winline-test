<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winline Пополнение</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gx:0px;
  --gr:0px;
  --stage:#2A2A2D;--stage-fg:#F2F2F3;--stage-muted:#9A9AA0;--stage-line:#3A3A3F;--stage-card:#333338;
  --page:#F5F6F8;--surface:#FFFFFF;--subtle:#EDEFF2;
  --text:#1A1A1A;--text2:#6B6F76;--text3:#8D929C;--disabled:#B4B8C0;--on-accent:#FFFFFF;
  --line:#E7E8EB;--line-strong:#C9CDD5;
  --accent:#FF5A00;--accent-hover:#E85000;--accent-pressed:#CC4700;--accent-soft:#FFF1E8;
  --success:#1DB954;--success-soft:#E5F7EC;--error:#E5383B;--error-soft:#FDECEC;
  --warn:#C77700;--warn-soft:#FFF4DB;--info:#2F6FED;--info-soft:#E8F0FE;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.35;padding-block:0;padding-left:var(--gx);padding-right:var(--gr)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px}
.info{width:340px;align-self:stretch;display:flex;flex-direction:column;gap:20px;color:var(--stage-fg);padding-top:8px}
.info h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.info p{margin:0;color:var(--stage-muted);font-size:14px;line-height:1.5;max-width:320px}
.info h2{margin:8px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted);font-weight:700}
.scn{display:flex;flex-direction:column;gap:6px}
.scn button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--stage-card);border:1px solid var(--stage-line);color:var(--stage-fg);font-weight:700;font-size:13px;min-height:44px}
.scn button small{font-weight:500;color:var(--stage-muted);font-size:12px}
.scn button[aria-pressed=true]{border-color:var(--accent);background:#3A302B}
.restart{margin-top:4px;align-self:flex-start;padding:10px 16px;border-radius:100px;border:1px solid var(--stage-line);color:var(--stage-fg);font-weight:700;font-size:13px;min-height:44px}
.phone{position:relative;width:412px;height:min(844px,calc(100vh - 48px));min-height:640px;border-radius:44px;background:#0F0F10;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px #46464B inset;flex:none}
.app{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--page);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;height:68px;padding:8px 16px 4px;background:var(--page);flex:none}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);transition:background .15s}
.iconbtn:hover{background:var(--subtle)}
.iconbtn:active{background:var(--line)}
.balance{margin-left:auto;display:flex;flex-direction:column;align-items:flex-start;padding:5px 12px;border-radius:12px;background:var(--surface);min-height:48px;justify-content:center}
.balance span{font-size:12px;font-weight:500;color:var(--text2);line-height:16px}
.balance b{font-size:18px;font-weight:800;line-height:22px}
.scroll{flex:1;overflow:auto;padding:20px 16px 16px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.scroll>*{flex:none}
h2.title{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.lead{margin:6px 0 0;color:var(--text2);font-size:14px}
.label{font-size:14px;font-weight:700;margin:0 0 10px}
.methods{display:flex;flex-direction:column;gap:8px}
.method{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;min-height:64px;transition:border-color .15s}
.method .logo{width:56px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.method .logo img,.method .logo svg{max-width:44px;max-height:30px;display:block}
.method .logo.full{border:0;background:transparent}
.method .logo.full img{width:56px;height:40px;max-width:none;max-height:none;object-fit:contain}
.method .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.method .t b{font-size:14px;font-weight:700}
.method .t small{font-size:12px;color:var(--text2);font-weight:500}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.method:not(:disabled):not([aria-checked=true]):hover{border-color:var(--line-strong);background:#FAFAFB}
.method:not(:disabled):not([aria-checked=true]):hover .radio{border-color:var(--text3)}
.method:not(:disabled):active{background:var(--subtle)}
.method[aria-checked=true]{border-color:var(--accent)}
.method[aria-checked=true] .radio{border-color:var(--accent)}
.method[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.method:disabled{background:var(--page);cursor:not-allowed}
.method:disabled .t b,.method:disabled .t small{color:var(--disabled)}
.method:disabled .logo{opacity:.45;filter:grayscale(1)}
.method:disabled .radio{border-color:var(--line)}
.field{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:8px;min-height:64px;transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field.err{border-color:var(--error);background:var(--error-soft)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:28px;font-weight:800;color:var(--text);outline:none;padding:0;height:44px}
.field input::placeholder{color:var(--disabled)}
.field .cur{font-size:14px;font-weight:800;color:var(--text2)}
.hint{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text2);min-height:16px}
.hint.err{color:var(--error);font-weight:600}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;height:44px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chip:not(:disabled):hover{border-color:var(--line-strong);background:#FAFAFB}
.chip[aria-pressed=true]:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-pressed)}
.chip:disabled{color:var(--disabled);background:var(--page)}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--info-soft);color:var(--text)}
.alert svg{flex:none;margin-top:1px}
.alert b{display:block;font-size:14px;font-weight:700}
.alert span{display:block;margin-top:2px;font-size:13px;color:var(--text2)}
.alert.warn{background:var(--warn-soft)}
.link{align-self:flex-start;color:var(--accent);font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--accent-hover)}
.link:active{color:var(--accent-pressed)}
.actions{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.btn{height:52px;border-radius:14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:background .15s}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:active{background:var(--accent-pressed)}
.btn.primary:disabled{background:var(--subtle);color:var(--disabled);cursor:not-allowed}
.btn.secondary{background:var(--surface);border:1.5px solid var(--line-strong);color:var(--text);height:48px}
.btn.secondary:hover{background:var(--page);border-color:var(--text3)}
.btn.secondary:active{background:var(--subtle)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--text2);animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tabbar{flex:none;height:64px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--text3);min-height:44px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent)}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:12px}
.badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.badge.ok{background:var(--success-soft)}.badge.bad{background:var(--error-soft)}.badge.wait{background:var(--warn-soft)}.badge.warn{background:var(--accent-soft)}
.res h2{margin:4px 0 0;font-size:24px;font-weight:800;line-height:1.15}
.res p{margin:0;color:var(--text2);font-size:14px;max-width:320px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.row span{color:var(--text2)}.row b{font-weight:700;text-align:right}
.row b.pos{color:var(--success)}
.steps{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 0;text-align:left}
.step{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--text3)}
.step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none}
.step.now{color:var(--text)}
.step.now i{border-color:var(--line-strong);border-top-color:var(--accent);animation:sp .6s linear infinite}
.step.done{color:var(--text)}
.step.done i{background:var(--success);border-color:var(--success)}
.sheet-bg{position:absolute;inset:0;background:rgba(26,26,26,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px 16px;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.sheet p{margin:0;color:var(--text2)}
.sheet textarea{width:100%;min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--page);padding:12px 14px;font:inherit;font-size:14px;resize:none;color:var(--text)}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:#1A1A1A;color:#fff;border-radius:14px;padding:13px 16px;font-weight:600;font-size:14px;z-index:30;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){
  .stage{display:block;padding-block:0;min-height:100vh}
  .info{display:none}
  .phone{width:100%;height:100vh;min-height:0;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .app{border-radius:0}
  @supports (height:100dvh){.phone{height:100dvh}}
}
@media (min-width:761px) and (max-width:1000px){.info{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="stage">
  <aside class="info">
    <div>
      <h1>Winline, пополнение счёта</h1>
    </div>
    <p>Кликабельный прототип тестового задания. Выберите способ оплаты, введите сумму и пройдите путь до результата. Внутри собраны и негативные сценарии.</p>
    <h2>Что произойдёт после оплаты</h2>
    <div class="scn" id="scn"></div>
    <button class="restart" id="restart" type="button">Начать сначала</button>
  </aside>
  <div class="phone"><div class="app" id="app"></div></div>
</div>

 '<textarea id="msg" placeholder="Ваше сообщение" aria-label="Сообщение"></textarea>'+
 '<button class="btn primary" type="button" id="sendmsg">Отправить</button><button class="btn secondary" type="button" id="closesheet">Закрыть</button></div></div>'}
function render(){
 var h='',sc=S.screen;
 if(sc==='form')h=formHTML();
 else if(sc==='loading')h=loadingHTML();
 else h=resultHTML();
 app.innerHTML=h+(S.sheet?sheet():'')+'<div class="toast" role="status"></div>';
 bind();
}
function formHTML(){
 var a=amt(),m=meth(S.method),ok=valid(),over=a!==null&&a>m.max,under=a!==null&&a<5,err=(over||under);
 var hint=err?'<div class="hint err" id="hint">'+I.err+'<span>'+(under?'Минимальная сумма 5 BYN':'Максимум '+m.max+' BYN за одну операцию')+'</span></div>':'<div class="hint" id="hint">Минимум 5 BYN, максимум '+m.max+' BYN</div>';
 var list=METHODS.map(function(x){
  var off=x.off||(x.id==='erip'&&S.unavailable);
  var sub=x.id==='erip'&&S.unavailable?'Технические работы до 14:00':x.sub;
  return '<button type="button" role="radio" class="method" data-m="'+x.id+'" aria-checked="'+(S.method===x.id)+'"'+(off?' disabled':'')+'><span class="logo'+(x.id==='erip'||x.id==='card'?'':' full')+'">'+logo(x.id)+'</span><span class="t"><b>'+x.name+'</b><small>'+sub+'</small></span><span class="radio"></span></button>'}).join('');
 var chips=[10,20,50,100].map(function(v){return '<button type="button" class="chip" data-chip="'+v+'" aria-pressed="'+(a===v)+'">'+v+' BYN</button>'}).join('');
 return topbar()+'<main class="scroll" id="sc"><div><h2 class="title">Пополнение счёта</h2><p class="lead">Выберите способ оплаты и введите сумму.</p></div>'+
 (S.unavailable?'<div class="alert warn">'+I.warn+'<div><b>ЕРИП временно недоступен</b><span>Мы выбрали банковскую карту. Остальные способы работают.</span></div></div>':'')+
 '<section><p class="label">Способ оплаты</p><div class="methods" role="radiogroup" aria-label="Способ оплаты" id="methods">'+list+'</div></section>'+
 '<section id="amountsec"><p class="label"><label for="amt">Сумма пополнения</label></p><div class="field'+(err?' err':'')+'" id="field"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(S.raw)+'" aria-describedby="hint"'+(err?' aria-invalid="true"':'')+'><span class="cur">BYN</span></div>'+hint+'<div class="chips">'+chips+'</div></section>'+
 '<div class="alert">'+I.info+'<div><b>Зачисление до 5 минут</b><span>Если деньги не пришли, напишите в поддержку.</span></div></div>'+support()+'</main>'+
 '<div class="actions"><button class="btn primary" type="button" id="pay"'+(ok?'':' disabled')+'>'+(ok?'Пополнить '+fmt(a)+' BYN':'Пополнить')+'</button><button class="btn secondary" type="button" id="cancel">Отмена</button></div>'+tabbar();
}
var STEPS=['Запрос отправлен в банк','Ждём подтверждение','Зачисляем на счёт'];
function loadingHTML(){
 return topbar()+'<main class="scroll"><div class="res" style="padding-top:20px"><div class="badge warn">'+I.wallet+'</div><h2>Обрабатываем платёж</h2><p>Не закрывайте страницу и не нажимайте «Назад». Это займёт несколько секунд.</p></div>'+
 '<div class="steps" id="steps">'+STEPS.map(function(t,i){var c=i<S.step?'done':(i===S.step?'now':'');return '<div class="step '+c+'"><i>'+(i<S.step?I.tick:'')+'</i>'+t+'</div>'}).join('')+'</div></main>'+
 '<div class="actions"><button class="btn primary" type="button" disabled><span class="spin"></span>Подождите</button></div>'+tabbar();
}
function resultHTML(){
 var o=S.outcome,a=S.last.a,m=meth(S.last.m),A=fmt(a)+' BYN',b,rows,btns,badge,title,text;
 if(o==='failed'){badge='<div class="badge bad">'+I.x+'</div>';title='Платёж не прошёл';text='Банк отклонил операцию, деньги с карты не списаны. Попробуйте ещё раз. Если ошибка повторится, обратитесь в поддержку.';
  rows=[['Сумма',A],['Способ',m.name],['Код ошибки','05']];
  btns='<button class="btn primary" type="button" data-act="retry">Повторить '+A+'</button><button class="btn secondary" type="button" data-act="other">Другой способ</button>'}
 else if(o==='insufficient'){badge='<div class="badge bad">'+I.wallet+'</div>';title='Не хватает средств';text='Пополните карту или выберите другой способ. Сумма '+A+' сохранена.';rows=null;
  btns='<button class="btn primary" type="button" data-act="other">Другой способ</button><button class="btn secondary" type="button" data-act="amount">Изменить сумму</button>'}
 else if(o==='pending'){badge='<div class="badge wait">'+I.clock+'</div>';title='Проверяем платёж';text='Обычно это занимает до 5 минут. Баланс обновится сам, страницу можно закрыть.';
  rows=[['Сумма',A],['Способ',m.name],['Статус','В обработке']];
  btns='<button class="btn primary" type="button" data-act="games">К играм</button><button class="btn secondary" type="button" data-act="history">История операций</button>'}
 else{badge='<div class="badge ok">'+I.check+'</div>';title='Баланс пополнен';text=A+' уже на счёте. Удачной игры.';
  rows=[['Зачислено','+'+A,1],['Новый баланс',fmt(S.balance)+' BYN']];
  btns='<button class="btn primary" type="button" data-act="games">Играть</button><button class="btn secondary" type="button" data-act="again">Пополнить ещё</button>'}
 var rh=rows?'<div class="rows">'+rows.map(function(r){return '<div class="row"><span>'+r[0]+'</span><b'+(r[2]?' class="pos"':'')+'>'+r[1]+'</b></div>'}).join('')+'</div>':'';
 var sup=(o==='failed'||o==='pending')?support():'';
 return topbar()+'<main class="scroll"><div class="res">'+badge+'<h2>'+title+'</h2><p>'+text+'</p></div>'+rh+sup+'</main><div class="actions">'+btns+'</div>'+tabbar();
}
function bind(){
 var back=$('#back',app);if(back)back.onclick=function(){
  if(S.screen==='form')toast('Это первый экран прототипа');
  else if(S.screen==='loading')toast('Дождитесь окончания обработки');
  else{S.screen='form';render()}};
 var tabs=app.querySelectorAll('[data-tab]');for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){toast('Раздел вне прототипа')};
 var sp=app.querySelectorAll('[data-support]');for(i=0;i<sp.length;i++)sp[i].onclick=function(){S.sheet=true;render()};
 var cs=$('#closesheet',app);if(cs)cs.onclick=function(){S.sheet=false;render()};
 var bg=$('#sheetbg',app);if(bg)bg.onclick=function(e){if(e.target===bg){S.sheet=false;render()}};
 var sm=$('#sendmsg',app);if(sm)sm.onclick=function(){S.sheet=false;render();toast('Сообщение отправлено')};
 if(S.screen==='form'){
  var ms=app.querySelectorAll('[data-m]');for(i=0;i<ms.length;i++)ms[i].onclick=function(){S.method=this.getAttribute('data-m');render()};
  var inp=$('#amt',app);
  inp.oninput=function(){var v=this.value.replace(/[^0-9.,]/g,'').replace(',','.');var p=v.split('.');if(p.length>2)v=p[0]+'.'+p.slice(1).join('');var q=v.split('.');if(q[1]&&q[1].length>2)v=q[0]+'.'+q[1].slice(0,2);if(v.length>7)v=v.slice(0,7);S.raw=v;this.value=v;refresh()};
  var ch=app.querySelectorAll('[data-chip]');for(i=0;i<ch.length;i++)ch[i].onclick=function(){S.raw=this.getAttribute('data-chip');inp.value=S.raw;refresh()};
  $('#pay',app).onclick=pay;
  $('#cancel',app).onclick=function(){S.raw='';render();toast('Пополнение отменено')};
 }
 var ac=app.querySelectorAll('[data-act]');for(i=0;i<ac.length;i++)ac[i].onclick=function(){act(this.getAttribute('data-act'))};
}
function refresh(){
 var a=amt(),m=meth(S.method),ok=valid(),under=a!==null&&a<5,over=a!==null&&a>m.max,err=under||over;
 var f=$('#field',app),h=$('#hint',app),pay=$('#pay',app),inp=$('#amt',app);
 f.className='field'+(err?' err':'');
 if(err){inp.setAttribute('aria-invalid','true');h.className='hint err';h.innerHTML=I.err+'<span>'+(under?'Минимальная сумма 5 BYN':'Максимум '+m.max+' BYN за одну операцию')+'</span>'}
 else{inp.removeAttribute('aria-invalid');h.className='hint';h.textContent='Минимум 5 BYN, максимум '+m.max+' BYN'}
 pay.disabled=!ok;pay.textContent=ok?'Пополнить '+fmt(a)+' BYN':'Пополнить';
 var ch=app.querySelectorAll('[data-chip]');for(var i=0;i<ch.length;i++)ch[i].setAttribute('aria-pressed',String(a===Number(ch[i].getAttribute('data-chip'))));
}
function decide(a,m){
 if(S.forced){var f=S.forced;S.forced=null;S.scn='auto';syncScn();return f}
 if(a===13)return 'failed';
 if(a===66)return 'insufficient';
 if(m==='erip')return 'pending';
 return 'success';
}
function pay(){
 if(!valid())return;
 var a=amt(),m=S.method;
 S.last={a:a,m:m};S.step=0;S.screen='loading';render();
 var out=decide(a,m);
 clearTimeout(runT);
 var n=0;
 (function tick(){
  runT=setTimeout(function(){
   n++;S.step=n;
   if(n<STEPS.length){var st=$('#steps',app);if(st){st.innerHTML=STEPS.map(function(t,i){var c=i<n?'done':(i===n?'now':'');return '<div class="step '+c+'"><i>'+(i<n?I.tick:'')+'</i>'+t+'</div>'}).join('')}tick()}
   else{S.outcome=out;if(out==='success')S.balance=Number((S.balance+a).toFixed(2));S.screen='result';render()}
  },1100);
 })();
}
function act(x){
 if(x==='retry'){S.raw=fmt(S.last.a);S.method=S.last.m;S.screen='form';render();pay()}
 else if(x==='other'){S.screen='form';render();var el=$('#methods',app);if(el)el.scrollIntoView({block:'center'})}
 else if(x==='amount'){S.screen='form';render();var i=$('#amt',app);if(i){i.focus();i.select&&i.select()}}
 else if(x==='again'){S.raw='';S.screen='form';render()}
 else if(x==='games')toast('Раздел вне прототипа');
 else if(x==='history')toast('Раздел вне прототипа');
}
function syncScn(){var b=document.querySelectorAll('#scn button');for(var i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',String(b[i].getAttribute('data-s')===S.scn))}
function buildScn(){
 var el=$('#scn');el.innerHTML=SCN.map(function(s){return '<button type="button" data-s="'+s.id+'" aria-pressed="'+(s.id===S.scn)+'">'+s.t+'<small>'+s.d+'</small></button>'}).join('');
 var b=el.querySelectorAll('button');for(var i=0;i<b.length;i++)b[i].onclick=function(){
  var id=this.getAttribute('data-s');S.scn=id;S.forced=null;
  if(id==='unavailable'){S.unavailable=true;S.method='card';S.screen='form';clearTimeout(runT);render()}
  else{if(S.unavailable){S.unavailable=false}
   if(id!=='auto')S.forced=id;
   if(S.screen!=='form'&&S.screen!=='loading'){}
   render()}
  syncScn();
 };
}
$('#restart').onclick=function(){clearTimeout(runT);fresh();syncScn();render()};
buildScn();render();
})();
</script>

</html>
